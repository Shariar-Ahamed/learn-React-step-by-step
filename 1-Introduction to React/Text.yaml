title: "Hello React"
sections:

  introduction:
    description: >
      React is a JavaScript library for building user interfaces.
      It is not a framework and is not limited to the web.
      It can be used with other libraries to render in different environments.
      For example, React Native is used for mobile application development.

  web_usage:
    description: >
      For web development, React is used together with ReactDOM.
      React and ReactDOM are often compared with other web frameworks,
      as they solve similar problems.
      When called a "framework", it is a colloquial reference rather than a strict definition.

  core_goal:
    description: >
      React aims to reduce UI development bugs by using components.
      Components are self-contained pieces of code representing part of the UI.
      These components can be combined to build a complete user interface.
      React handles most rendering logic, allowing developers to focus on design.

  use_cases:
    description: >
      React does not enforce strict rules for project structure or conventions.
      Teams can define their own architecture based on their needs.
      It can be used for:
        - A single UI element (like a button)
        - Partial interface sections
        - Full-scale applications

  limitations_and_considerations:
    description: >
      React is not as simple to drop into an existing project as libraries like jQuery or Vue.
      It works best when building a full application using React from the start.
      Features like JSX require a build process.
      Tools like Babel are used for compilation, which adds complexity and can impact performance if not configured properly.

  tooling_and_modern_workflow:
    description: >
      Modern React development typically uses build tools such as Vite.
      These tools handle compilation, bundling, and development workflow optimization.
      The focus of this approach is building full user interfaces using React with efficient tooling support.